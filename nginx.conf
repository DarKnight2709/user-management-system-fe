server {
    listen 8080;
    server_name localhost;

    # Forward API requests to the backend running on the Docker Desktop host.
    # The trailing slash removes /api/ before forwarding the request.
    location /api/ {
        proxy_pass http://ums-backend:3000/;
        proxy_http_version 1.1;
    }

    location /storage/ {
        proxy_pass http://minio:9000/;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Dòng này cực kỳ quan trọng cho React Router:
        # Nếu không tìm thấy file thực tế, luôn điều hướng về index.html
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Bật nén Gzip để tải trang nhanh hơn
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}